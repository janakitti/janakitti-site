<p-carousel
  [value]="items"
  [numVisible]="3"
  [numScroll]="1"
  [circular]="true"
  showIndicators="{{ responsive.isMobile ? 'true' : 'false' }}"
  [responsiveOptions]="responsiveOptions"
  showNavigators="{{ responsive.isMobile ? 'false' : 'true' }}"
>
  <ng-template let-experience pTemplate="item">
    <!-- <div class="border-1 surface-border border-round m-2 p-3"></div> -->
    <div class="card border-1 surface-border border-round m-2 p-3">
      <img [src]="experience.imgUrl" />
    </div>
  </ng-template>
</p-carousel>
