<div class="shell" [ngClass]="responsive.isMobile ? 'mobile' : ''">
  <div class="banner" [ngStyle]="{ 'background-color': metadata[id].primary }">
    <h1 class="title">{{ metadata[id].title }}</h1>
    <h2 class="subtitle">{{ metadata[id].subtitle }}</h2>
  </div>
  <div class="spacer"></div>
  <markdown [src]="'/articles/' + id + '.md'"></markdown>
</div>
